[project]
name = "wslx"
version = "0.1.1"
description = "Manage Ubuntu WSL virtual machines from the command line"
readme = "README.md"
# Dual, at the user's choice -- the same pair `make` and `uv` ship under. MIT is
# the shortest read; Apache-2.0 adds an express patent grant (§3) and an explicit
# reservation of trademark rights (§6), which is what a company is asked for.
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Optersoft, S.L.", email = "david@optersoft.com" }
]
requires-python = ">=3.11"
keywords = ["wsl", "windows", "ubuntu", "vm", "cloud-init"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
# The instructions and the tutorial live on academy, not in the README -- so
# Homepage points there, and the repository is a separate link.
Homepage = "https://academy.optersoft.com/tool/wsl"
Documentation = "https://academy.optersoft.com/tool/wsl"
Repository = "https://github.com/optersoft/wsl"
Issues = "https://github.com/optersoft/wsl/issues"

[project.scripts]
wslx = "wslx.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
