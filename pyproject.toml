[project]
name = "wslx"
version = "0.1.0"
description = "Manage Ubuntu WSL virtual machines from the command line"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "David de Mingo", email = "david@xtec.dev" }
]
requires-python = ">=3.11"
keywords = ["wsl", "windows", "ubuntu", "vm", "cloud-init"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ddemingo/wsl"
Repository = "https://github.com/ddemingo/wsl"
Issues = "https://github.com/ddemingo/wsl/issues"

[project.scripts]
wslx = "wslx.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
