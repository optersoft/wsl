# Test on every push; build and publish to PyPI on a version tag.
#
# Publishing uses PyPI trusted publishing (OIDC) — no token is stored anywhere.
# It needs a publisher registered at
# https://pypi.org/manage/account/publishing/ with:
#
#   provider    GitHub
#   owner       ddemingo
#   repository  wsl
#   workflow    ci.yml
#   env         pypi   (optional; must match the `environment:` below if set)
#
# Release: `git tag -a v0.1.1 -m … && git push origin v0.1.1`, with the tag
# matching the `version` in pyproject.toml.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

env:
  UV_VERSION: "0.10.7"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for trusted publishing: lets the job mint the OIDC token
      # that PyPI exchanges for a one-off upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build
      # Catch a wheel that is missing files before it reaches PyPI.
      - run: uv run --isolated --no-project --with dist/*.whl -- wslx --version
      - run: uv run --isolated --no-project --with dist/*.tar.gz -- wslx --version
      - run: uv publish --trusted-publishing always
